[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "corlet"
version = "0.1.0"
description = "A microkernel framework for Python: containers, components, services, extension points and events."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "corlet contributors" }]
keywords = ["microkernel", "plugin", "component", "container", "di", "extension-point"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The core (corlet.core) depends on the standard library only.
dependencies = []

[project.optional-dependencies]
# Recommended: typed, validated component configuration.
pydantic = ["pydantic>=2.5"]
yaml = ["pyyaml>=6"]
all = ["pydantic>=2.5", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/FrostMiKu/corlet"
Issues = "https://github.com/FrostMiKu/corlet/issues"
Documentation = "https://github.com/FrostMiKu/corlet/tree/main/docs"

[project.scripts]
corlet = "corlet.std.cli:main"

[project.entry-points.pytest11]
corlet = "corlet.testing.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pydantic>=2.5",
    "pyyaml>=6",
    "mypy>=1.10",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "B027", "SIM105", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["src/corlet"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
